    <script>
    /* F5 / 首次載入：一律顯示 Wistron 轉圈 boot 覆蓋層，絕不貼回上次的舊畫面
       （避免看到暫存/舊資料）。第一筆資料畫完後由 app.js 呼叫 hideWistronBoot() 淡出。 */
    (function () {
      var boot = document.createElement("div");
      boot.className = "wistron-boot";
      boot.id = "wistron-boot";
      boot.innerHTML =
        '<div class="wistron-boot__ring">' +
          '<img class="wistron-boot__logo" src="/static/img/wistronlogo.png" alt="Wistron">' +
        '</div>' +
        '<div class="wistron-boot__wordmark">Wistron</div>' +
        '<div class="wistron-boot__msg">PA Server Manager 載入中…</div>';
      document.body.appendChild(boot);
      // 安全網：若 JS 崩潰導致 boot 永不淡出，8 秒後強制移除，避免永久白屏。
      window.__wistronBootGuard = setTimeout(function () {
        if (window.hideWistronBoot) window.hideWistronBoot();
      }, 8000);
      window.hideWistronBoot = function () {
        var el = document.getElementById("wistron-boot");
        if (el) { el.classList.add("is-hidden"); setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 400); }
        if (window.__wistronBootGuard) { clearTimeout(window.__wistronBootGuard); window.__wistronBootGuard = null; }
      };
    })();
    </script>

<!-- 新增系統 Modal -->
<div class="modal-backdrop" id="add-modal" style="display:none">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">＋ 新增系統</div>
      <button class="icon-btn" onclick="closeAdd()">✕</button>
    </div>
    <div class="modal-body">
      <p class="hint-msg">儲存時會先確認連線（都成功才新增）：<br>
        <b>OS</b>：使用 SSH 登入並抓取 <b>hostname</b> 作為系統名稱；若填入 <b>BMC IP</b> 也會 ping 確認可連。</p>

      <div class="field-row">
        <div class="field">
          <label>層級（Level）<span class="req">*</span></label>
          <select id="f-level" class="input" onchange="onAddLevelChange()">
            <option value="system">L10 · System Level（單機）</option>
            <option value="rack">L11 · Rack Level（整櫃）</option>
          </select>
        </div>
        <div class="field">
          <label>專案 <span class="req">*</span></label>
          <select id="f-project" class="input">
            <option value="">— 未分類 —</option>
          </select>
        </div>
      </div>
      <div class="field-row" id="f-rack-size-wrap" style="display:none">
        <div class="field">
          <label>機櫃占用高度 <span class="hint" style="font-weight:400">（L11 用，多 U 元件如 CDU/PDU/Switch）</span></label>
          <select id="f-rack-size" class="input">
            <option value="1" selected>1U</option>
            <option value="2">2U</option>
            <option value="3">3U</option>
            <option value="4">4U</option>
            <option value="6">6U</option>
            <option value="8">8U</option>
            <option value="12">12U</option>
            <option value="16">16U</option>
            <option value="24">24U</option>
            <option value="32">32U</option>
            <option value="42">42U</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>OS IP <span class="req">*</span></label>
        <input id="f-os-ip" type="text" placeholder="例: INTERNAL_IP_18" class="input">
      </div>
      <div class="field-row">
        <div class="field">
          <label>OS 帳號 <span class="req">*</span></label>
          <input id="f-os-user" type="text" placeholder="例: nvidia / root" class="input">
        </div>
        <div class="field">
          <label>OS 密碼 <span class="req">*</span></label>
          <div class="pw-wrap">
            <input id="f-os-pass" type="password" placeholder="OS 密碼" class="input pw-input" autocomplete="new-password">
            <button type="button" class="pw-eye" onclick="togglePw('f-os-pass', this)">👁</button>
          </div>
        </div>
      </div>
      <div class="field-row" style="display:none">
        <input id="f-os-port" type="hidden" value="22">
      </div>

      <div class="hr">BMC（必填，之後開/關機用）</div>
      <div class="field-row" style="align-items:center">
        <div class="field" style="flex:1">
          <label>BMC IP <span class="hint" style="font-weight:400">（系統依 OS 的 ipmitool 自動帶入）</span></label>
          <input id="f-bmc-ip" type="text" placeholder="由 ipmitool 自動抓取" class="input" disabled>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn small" id="probe-bmc-btn" onclick="probeBmc()">🔍 依 OS 抓取 BMC IP（需 ipmitool）</button>
        <span id="probe-bmc-dot" class="dot-sm" title="抓取 BMC IP 狀態"></span>
        <span id="probe-bmc-msg"></span>
      </div>
      <div class="field-row">
        <div class="field">
          <label>BMC 帳號 <span class="req" id="bmc-user-req">*</span></label>
          <input id="f-bmc-user" type="text" placeholder="例: root" class="input">
        </div>
        <div class="field">
          <label>BMC 密碼 <span class="req" id="bmc-pass-req">*</span></label>
          <div class="pw-wrap">
            <input id="f-bmc-pass" type="password" placeholder="BMC 密碼" class="input pw-input" autocomplete="new-password">
            <button type="button" class="pw-eye" onclick="togglePw('f-bmc-pass', this)">👁</button>
          </div>
        </div>
      </div>

      <div id="add-err" class="error-box" style="display:none"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeAdd()">取消</button>
      <button class="btn primary" id="save-btn" onclick="saveMachine()">儲存並連線測試</button>
    </div>
  </div>
</div>

<!-- 專案管理 Modal -->
<div class="modal-backdrop" id="project-modal" style="display:none">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">專案管理</div>
      <button class="icon-btn" onclick="closeProjectModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-row" style="margin-bottom:4px">
        <div class="field" style="flex:2">
          <label>專案名稱</label>
          <input id="new-project-name" type="text" placeholder="例: NCP / H100 / Miramar" class="input">
        </div>
        <div class="field" style="flex:2">
          <label>備註（選填）</label>
          <input id="new-project-desc" type="text" placeholder="說明" class="input">
        </div>
        <button id="project-add-btn" class="btn primary" style="align-self:flex-end;margin-bottom:2px" onclick="addProject()">新增專案</button>
      </div>
      <div id="project-err" class="error-box" style="display:none"></div>
      <table class="t">
        <thead><tr><th>專案</th><th>備註</th><th>機台數</th><th></th></tr></thead>
        <tbody id="project-list-body"></tbody>
      </table>
      <p class="hint-msg" style="margin-top:10px">刪除專案的條件：該專案下必須<b>沒有機台</b>。</p>
    </div>
  </div>
</div>

<!-- 終端機 Modal（左右雙欄：左 OS / 右 BMC；可拖曳 + 放大） -->
<div class="modal-backdrop" id="term-modal" style="display:none">
  <div class="modal term-modal term-drag" id="term-modal-box">
    <div class="term-drag-handle term-head" id="term-head">
      <div class="modal-title" id="term-title"><span class="grip">⠿</span> 終端機</div>
      <span class="spacer"></span>
      <button class="icon-btn term-max" id="term-max-btn" onclick="toggleTermMaximize()" title="放大 / 還原">⛶</button>
      <button class="icon-btn" onclick="closeTerm()" title="關閉">✕</button>
    </div>
    <div class="term-statusbar" id="term-status">
      <span id="term-os-status">OS 連線中…</span>
      <div class="term-mode" id="term-mode">
        <button class="btn small term-mode-btn" id="term-mode-both" title="OS 與 BMC 並排顯示" onclick="setTermMode('both')">◫ 並排</button>
        <button class="btn small term-mode-btn" id="term-mode-os" title="只顯示 OS，放大佔滿" onclick="setTermMode('os')">🖥 OS 放大</button>
        <button class="btn small term-mode-btn" id="term-mode-bmc" title="只顯示 BMC，放大佔滿" onclick="setTermMode('bmc')">🌐 BMC 放大</button>
      </div>
      <span id="term-bmc-status">BMC 連線中…</span>
    </div>
    <div class="term-body">
      <div class="term-pane term-pane-os" id="term-os-pane">
        <div class="term-pane-label">OS</div>
        <div class="term-box" id="term-os"></div>
      </div>
      <div class="term-pane term-pane-bmc" id="term-bmc-pane">
        <div class="term-pane-label">BMC</div>
        <div class="term-box" id="term-bmc"></div>
      </div>
    </div>
  </div>
</div>

<!-- 廣播終端 Modal（同時控制多台 rack 系統，可選主機） -->
<div class="modal-backdrop" id="bc-modal" style="display:none">
  <div class="modal bc-modal bc-drag" id="bc-modal-box">
    <div class="term-drag-handle bc-head" id="bc-head">
      <div class="modal-title" id="bc-title"><span class="grip">▦</span> 📡 廣播終端 <span class="hint" id="bc-title-hint"></span></div>
      <span class="spacer"></span>
      <button class="icon-btn bc-max" id="bc-max-btn" onclick="toggleBcMaximize()" title="放大 / 還原">⛶</button>
      <button class="icon-btn" onclick="closeBroadcast()" title="關閉">✕</button>
    </div>
    <div class="bc-topbar">
      <div class="bc-tabs" id="bc-tabs"></div>
      <div class="bc-ctrl">
        <button class="btn small" id="bc-grid-btn" onclick="bcSetGrid(!bcState.grid)" title="同時顯示全部主機（方形網格，幾台就排幾格）"><span class="bc-chk-box"></span>全部顯示</button>
        <button class="btn small active" id="bc-bcast-on" onclick="bcSetBroadcast(true)" title="廣播模式">📡 廣播全部</button>
        <button class="btn small" id="bc-bcast-off" onclick="bcSetBroadcast(false)" title="只操作目前選取主機">◈ 目前主機</button>
      </div>
    </div>
    <div class="bc-body">
      <div class="bc-panes" id="bc-panes"></div>
      <div class="bc-hlog" id="bc-hlog"></div>
    </div>
    <div class="bc-statusbar" id="bc-status">
      <div class="bc-bcastbar">
        <span class="bc-bc-label">📡 指令列</span>
        <input id="bc-input" type="text" placeholder="輸入指令，Enter 送出（自動加到目前主機或全部主機）" autocomplete="off" spellcheck="false">
      </div>
      <span class="hint" id="bc-status-txt" style="white-space:nowrap"></span>
    </div>
  </div>
</div>
