<section class="ug-sec" id="ug-intro"><h2>1. 使用方式與第一次操作</h2>
<p>從頂列「使用手冊」按鈕或鍵盤 <code>?</code> 開啟本手冊。可搜尋關鍵字、拖動視窗或最大化閱讀。</p>
<ol><li>建立專案，確認是 L10 單機測試或 L11 整櫃管理。</li>
<li>新增設備並確認類型、OS／BMC 管理位址；多節點伺服器先整理各個 OS Slot。</li>
<li>設定實際 U 高度，再把 L11 設備放到機櫃位置；CDU 另外選擇內置或外置。</li>
<li>進入「網路拓樸」，匯入設備、設定節點與實體埠、配對接線，再儲存拓樸。</li>
<li>用「檢查 IP」確認節點可達，用「整櫃連線檢查」查看整櫃摘要及 3D 指示燈。</li>
<li>需要操作設備時，先核對「目前操作目標」的 Node、OS Slot 與位址，再開 Terminal、KVM 或執行電源操作。</li>
<li>進行驗證時，先分辨 Test Library 的單選 PA Agent 流程、多選批次指令，以及需要 PRE 確認的 Cycle 流程。</li></ol>
<p><b>先分清楚：</b>規劃接線是設計；已確認連線是人工確認；Ping 是 IP 可達性；SSH 認證成功是帳號登入成功；它們都不能單獨證明設備健康或實際電源狀態。</p>

<section class="ug-sec" id="ug-nav"><h2>2. 首頁、搜尋與專案管理</h2>
<p>首頁「總覽」整理 Project Inspection Health、需要處理的 FAIL／WARN、Cycle 執行與 Telemetry 狀態。Coverage 與 Hardware Health 分開判讀；OS Ping 可達只表示網路連線成功，不代表硬體健康或驗證通過。</p>
<ol><li>在系統與專案清單選擇 L10／L11、專案或狀態條件。</li>
<li>輸入專案名稱、設備名稱、OS IP 或 BMC IP 搜尋；找不到時先清除篩選。</li>
<li>點設備進系統詳情，點整櫃入口進「機櫃管理」。瀏覽器上一頁可回到先前頁面。</li>
<li>利用專案管理新增、編輯與排序專案；清單可調整順序、收合及切換緊湊顯示。空專案仍可新增設備。</li></ol>
<p>移動專案、刪除設備或專案前，先看確認視窗的對象與影響。網路拓樸保存的是設備快照，庫存更名或搬移後應一併檢查拓樸對應。頂列可切換明暗主題。</p>
</section>
<section class="ug-sec" id="ug-add"><h2>3. 新增系統與設備分類</h2>
<ol><li>開啟新增系統，選擇專案及 L10／L11。</li>
<li>伺服器填入 OS IP、SSH 使用者、密碼與連接埠；SSH 一般為 22。依需要填 BMC 資料。</li>
<li>送出後系統會驗證 SSH 並讀取主機名稱；若提供 BMC IP，也會檢查相關連線。失敗時依錯誤修正位址或認證，不要把 Ping 成功當作 SSH 成功。</li>
<li>確認 MGX／設備類型及機櫃規格，再完成配置。</li></ol>
<table class="ug-table"><tr><th>類型</th><th>用途與差異</th></tr><tr><td>Server 伺服器</td><td>OS／BMC 配對、多 OS 節點、硬體資訊與伺服器操作。</td></tr><tr><td>Switch、NVLink、Network</td><td>交換器、NVLink 設備及其他網路設備；操作依能力設定。</td></tr><tr><td>Power Shelf、PDU</td><td>電源設備；管理網路與實際供電線分開處理。</td></tr><tr><td>CDU、Storage</td><td>冷卻分配設備、儲存設備；Telemetry 取決於 Exporter 支援。</td></tr><tr><td>Blank Panel 空白面板</td><td>佔用 U 空間的被動面板，不做 Ping、SSH、電源操作或 LED 狀態。</td></tr></table>
<p>分類未確認時，先明確選擇類型。不可因為設備有 IP，就假設它支援伺服器的開關機指令。</p>
</section>
<section class="ug-sec" id="ug-l10"><h2>4. 單機詳情與操作目標</h2>
<p>系統詳情包含概覽、硬體、Node、Hardware Health、Telemetry 與驗證。多節點設備在「節點」頁維持各實體槽位的獨立身分；右側「操作」依設備能力提供 Terminal、KVM、設備設定與電源控制。</p>
<ol><li>先看設備名稱、專案層級、元件類型及右側「目前操作目標」。</li>
<li>多 OS 設備先選目前 OS；畫面的 OS IP、配對 BMC 與後續操作會隨目標改變。</li>
<li>硬體頁查看 CPU、記憶體、磁碟、NIC、GPU 與韌體等實際採集資訊；空白或破折號表示未取得，不是數值零。</li>
<li>需要最新資料時使用重新整理；記錄採集時間，分辨快取與新結果。</li></ol>
<p>設備視圖用於位置與類型辨識；實際配置與狀態以系統回報資料為準。MAC 僅在有對應觀測資料時顯示。系統診斷提供檢查結果，不會自動修復硬體。</p>
</section>
<section class="ug-sec" id="ug-os"><h2>5. Node、OS Slot 與操作目標</h2>
<p>一台實體 Server 可以有多個節點；不是每個專案都固定四個。「節點」管理各節點的 OS 與配對 BMC。切換目前節點只會改變操作目標，不會修改既有 Cycle 任務。</p>
<ol><li>進入設備詳情的「節點（Nodes）」頁，核對實體 OS Slot 與已安裝節點。</li>
<li>新增節點並填寫連線資訊。可先建立計畫節點，或選擇授權探測後建立；建檔不代表硬體已驗證。</li>
<li>檢查辨識結果與配對 BMC；未取得時編輯補齊。</li>
<li>逐一切換目前 OS，確認右側目標的 OS／BMC 位址正確。</li>
<li>完成節點資料後，再到網路拓樸匯入或更新節點對應。</li></ol>
<p>編輯密碼留白會保留原值。退役節點會保留歷史與實體槽位，其他節點不會重新編號。更換實體節點需建立新身分；修改標籤或連線請使用「編輯連線」。拓樸裡新增邏輯節點，不會自動建立可登入的 OS Slot。</p>
<p>拓樸匯入可依有效 OS Slots 推定節點數；沒有資料時使用手動設定。既有拓樸是快照，新增 OS Slot 後要回拓樸核對，不會自動改掉已規劃的接線。</p>
</section>
<section class="ug-sec" id="ug-ip"><h2>6. 管理 IP、認證與設備能力</h2>
<p>「修改管理 IP」更新 PA Manager 的連線紀錄，<b>不會幫設備設定固定 IP、網卡或交換器 VLAN</b>。先在設備端配置，再填入管理系統。</p>
<ul><li>伺服器修改 OS 連線時會驗證 SSH 與主機識別；目前 OS 及其 BMC 配對必須一致。</li>
<li>Switch、CDU、Power Shelf 等非伺服器，可更新既有管理連線；同時有 OS 與 BMC 紀錄時，選清楚要改哪一組。</li>
<li>非伺服器修改位址會保留既有認證；要開 SSH Terminal，仍需有可用位址、帳號與密碼。</li>
<li>IPMI 的 623 與 SSH 的 22 用途不同。BMC Terminal 會處理舊 IPMI 埠值，明確設定的 SSH 埠仍以設定為準。</li>
<li>非伺服器電源操作取決於支援能力與已設定的自訂指令；沒有按鈕不代表單純連線故障。</li></ul>
</section>
<section class="ug-sec" id="ug-l11"><h2>7. L10 升級、設備高度與 48U 配置</h2>
<ol><li>在 L10 單機右側選「升級至 L11／設定高度」，指定 L11 專案及設備實際 U 高度。</li>
<li>升級後設備先是未上架；進「機櫃管理」的「48U 配置」，選設備與起始位置。</li>
<li>查看放置預覽，確認沒有重疊或超出機櫃，再儲存。</li>
<li>高度填錯時用「修正設備高度」，不要靠搬移位置改規格。</li></ol>
<p>位置使用設備最上方 U：例如 top U 48、高度 4U，佔用 U48～U45。一般設備高度為 1～48U；外置 CDU 為特殊 0U，不佔內部空間。</p>
<p>修正高度會檢查碰撞；內置 CDU 以底部 U1 為基準。普通拖放／移位保留既有類型與高度。機櫃摘要顯示已安裝元件、已用及可用 U，未上架或位置無效的設備需要先處理。</p>
<p>下架與刪除是不同操作：下架保留設備紀錄。空白面板佔用 U 並持續顯示，與有沒有網路接線無關。</p>
</section>
<section class="ug-sec" id="ug-cdu"><h2>8. CDU 內置、外置與單機外觀</h2>
<ol><li>選 CDU 的安裝設定，選擇機櫃內置或外置。</li>
<li>內置要填實際高度，從 U1 向上佔用空間；先處理該範圍的設備與空白面板碰撞。</li>
<li>外置採 0U，顯示在機櫃旁，不消耗 48U。</li>
<li>儲存後，單機詳情外觀會依內／外置更新；同專案的 CDU 配置受數量與位置檢查限制。</li></ol>
<p>外置 CDU 的 Cooling 藍色燈條是外觀動畫，不代表 Ping 成功。Ping 狀態看獨立的小型狀態燈。Power Shelf 的外觀則與 Rack 共用每 U 風扇的呈現方式。</p>
</section>
<section class="ug-sec" id="ug-scene"><h2>9. 3D 機櫃、聚焦與走線</h2>
<p>「機櫃管理」可切換 3D 機櫃、48U 配置、清單、Telemetry 與網路拓樸。3D 控制可切正面、背面或透視、縮放、重設、放大檢視、暫停動畫及顯示／隱藏走線。</p>
<ol><li>點模型或用設備選單選取元件，查看對應資訊。</li>
<li>使用聚焦放大設備。外置 CDU 聚焦會單獨展示櫃體，方便旋轉檢查；重設視角或選其他機櫃設備回到整櫃。</li>
<li>先儲存網路拓樸，讓有效且已上架的設備接線呈現在 3D。</li>
<li>線路沿左右線槽整理到交換器側邊；目前不代表精確到每一個實體插孔的位置。</li></ol>
<p>至少一條有效可繪製接線才會顯示線槽；沒有接線不顯示線槽，<b>仍會顯示空白面板</b>。自訂設備若沒有實體庫存對應、設備未上架或端點無效，接線可能不會畫在 3D，應查看提示及拓樸設定。</p>
<p>畫布取得焦點時，方向鍵旋轉、Shift＋方向鍵加大幅度、Home 重設、＋／－縮放；Esc 可離開展開檢視。偏好減少動態效果的環境會減少或停止動畫。</p>
</section>
<section class="ug-sec" id="ug-topology"><h2>10. 網路拓樸：建立、草稿與儲存</h2>
<p>網路拓樸是同一套接線工作區，不需要再維護另一份空的機櫃拓樸。它描述設備、邏輯節點、實體埠與線路；不會自動掃描交換器或配置網路。</p>
<ol><li>在專案的「機櫃管理」開「網路拓樸」。第一次使用按「＋ Rack」建立拓樸機櫃並命名。</li>
<li>選「從專案加入設備」，匯入需要的伺服器、交換器、CDU、Power Shelf 等。沒有庫存紀錄時可新增自訂設備。</li>
<li>展開設備檢查節點、管理 IP 與埠；需要時編輯。</li>
<li>設定配對或批次接線，按「套用至草稿」。</li>
<li>檢查結果後按「儲存拓樸」，才寫入專案並供 IP 檢查及 3D 使用。</li></ol>
<p><b>套用至草稿不等於已儲存。</b>離開前看儲存狀態。拓樸 Rack 是專案內的規劃分組，新增它不會自動把設備放進實體 48U 配置。</p>
<p>若其他人已修改同一份資料，版本衝突時先匯出 JSON 保留草稿，再重載核對。匯出可備份目前內容；目前沒有對應的 JSON 匯入介面。刪除拓樸設備或埠會影響依附接線，刪除節點會影響埠的節點映射；操作前先檢查。</p>
</section>
<section class="ug-sec" id="ug-nodes"><h2>11. 拓樸節點與實體 RJ45 的關係</h2>
<p>節點代表可識別的 OS／DPU；埠代表實際接線孔。四個節點不一定需要四條網路線。</p>
<ol><li>匯入時優先依有效 OS Slot 判斷每台節點數；沒有資料時手動指定 1～64 個，依各設備實際情況調整。</li>
<li>依實際硬體設定 Host 與 DPU 的對應關係，不由節點數量推定配置。</li>
<li>填各節點 Host OS、Host BMC、DPU OS、DPU BMC 資訊。</li>
<li>在埠設定指定該埠服務哪些節點。共享管理埠可以對應多個邏輯節點，但一個實體埠只能配一條線。</li></ol>
<p>節點數量、網路卡數量與管理線數量應分別依實際配置確認。共享管理埠可服務多個節點，不應以節點數直接推算實體接線數。</p>
<p>共享 BMC 位址可依實際設計填寫。DPU、BMC 位址可以保存作對應資料，但目前「檢查 IP」的伺服器範圍是 Host OS，不會把所有欄位都 Ping 一次。</p>
</section>
<section class="ug-sec" id="ug-cables"><h2>12. 配對連線、批次接線與顏色</h2>
<ol><li>少量接線用「配對連線」，選兩端設備與實體埠，指定網路角色、規劃／已確認狀態，填線號或 VLAN 備註。</li>
<li>大量伺服器用「批次接線」，核對勾選清單順序、Host 交換器、DPU 交換器及起始埠。</li>
<li>確認埠數足夠且未佔用；若端點不明或埠不足，先修正再套用，避免只生成半套線。</li>
<li>交換器互連用未使用埠另行配對；CDU 與 Power Shelf 依實際管理線加入。</li>
<li>儲存拓樸，再看 3D 走線。</li></ol>
<table class="ug-table"><tr><th>角色</th><th>3D 顏色／線槽側</th></tr><tr><td>Host 管理</td><td>青藍色／左側</td></tr><tr><td>DPU 管理</td><td>紫色／右側</td></tr><tr><td>Power Shelf 管理</td><td>橘色／左側</td></tr><tr><td>CDU 管理</td><td>青綠色／左側</td></tr><tr><td>交換器上行／互連</td><td>金色／右側</td></tr><tr><td>資料網路／其他</td><td>綠色／灰色，依接線設定呈現</td></tr></table>
<p>顏色依線路角色，不是線材真實顏色，也不是 Ping 成敗。Power 類接線在這裡是電源設備的<b>管理網路線</b>，不是供電纜線。虛線代表規劃中，實線代表人工已確認；批次新增預設仍需依實際接線確認。</p>
<p>使用網路篩選與點選設備可聚焦相關連線。確認線路時仍要核對兩端標籤，不能只靠圖上相鄰位置判斷。</p>
</section>
<section class="ug-sec" id="ug-naboo"><h2>13. 新專案配置流程</h2>
<ol><li>確認設備類型、數量與各設備的 OS 節點。</li><li>填寫實際管理 IP、連線資訊與硬體對應。</li><li>核對 U 高度、安裝位置與外置設備。</li><li>將設備加入拓樸，核對節點、實體埠及交換器可用埠。</li><li>建立接線並儲存，依現場配置確認兩端標籤。</li><li>執行「檢查 IP」與「整櫃連線檢查」，保存結果並處理未回應目標。</li></ol>
<p>設備、節點與接線數量依專案實際配置決定。新增或更換設備後，應同步核對庫存、拓樸與管理連線；人工確認的接線狀態不等於軟體已驗證實體接線。</p>
</section>
<section class="ug-sec" id="ug-ping"><h2>14. 網路拓樸的「檢查 IP」</h2>
<ol><li>先設定固定 IP，確認管理系統主機能到達該網段。</li>
<li>儲存拓樸，選要檢查的拓樸 Rack，再按「檢查 IP」。</li>
<li>查看整體結果與失敗摘要，用失敗、部分成功或未設定 IP 等條件定位設備。</li>
<li>展開問題設備，核對節點名稱、IP 及結果，修正後重新檢查。</li></ol>
<p>Server 檢查各 Host OS 節點；其他設備使用主要管理 IP（優先 OS 管理位址，無則使用 BMC 位址）。伺服器節點先用已儲存拓樸資料，缺少的節點資料再依庫存 OS Slots／主要 OS 紀錄補足。它不檢查 DPU OS、Host BMC 與 DPU BMC 的所有位址。</p>
<table class="ug-table"><tr><th>結果</th><th>應如何理解</th></tr><tr><td>全部成功</td><td>本次有設定的檢查目標都有 ICMP 回應。</td></tr><tr><td>部分成功</td><td>同台有節點成功也有失敗；展開查看是哪個節點與 IP。</td></tr><tr><td>失敗／無回應</td><td>本次未收到回應；可能是路由、防火牆、ICMP 設定或設備問題。</td></tr><tr><td>未設定 IP／未檢查</td><td>沒有可用目標或尚未執行，不應判定斷線。</td></tr></table>
<p>例如 Server 01 的 Node 1、2、4 成功、Node 3 無回應，摘要會保留設備、節點與 IP，供你找 Node 3；不會只給整櫃一個紅點。Ping 結果不會改寫人工確認的線路狀態，也不能證明某個交換器實體埠、VLAN 或那一條線正確。</p>
</section>
<section class="ug-sec" id="ug-rack-ping"><h2>15. 整櫃連線檢查、失敗摘要與 3D LED</h2>
<p>「機櫃管理」的「整櫃連線檢查」以 ICMP Ping 檢查已上架 L11 設備，包含有效的外置 0U CDU；不包含空白面板、L10 或未上架設備。Ping 可達不代表硬體健康或驗證成功。</p>
<ol><li>確認 3D 與庫存位置正確，按「整櫃連線檢查」。</li>
<li>在 3D 上方查看失敗摘要，不必遮住模型找問題。</li>
<li>選取設備看節點、IP 與檢查時間，再針對失敗目標排查。</li></ol>
<table class="ug-table"><tr><th>小型狀態燈</th><th>含意</th></tr><tr><td>綠色閃爍</td><td>該設備本次已設定的檢查目標全部回應。</td></tr><tr><td>紅色閃爍</td><td>至少一個目標沒有回應；四節點中只有一個失敗也會紅。</td></tr><tr><td>灰色</td><td>尚未檢查或沒有可用 IP。</td></tr></table>
<p>指示燈位於有電設備的機身，空白面板沒有。這是<b>Ping 可達性視覺化，不是真實電源感測值</b>。作業系統關閉 ICMP 時，即使設備有電也可能紅燈。減少動態效果設定會使燈保持靜態；CDU 藍色裝飾燈條與這個狀態不同。</p>
<p>結果是本次檢查快照，切換專案或儲存拓樸後需重新檢查，不是持續自動監控。大量目標會分批並行；失敗會重試一次。單次上限為 2048 個不重複 IP、4096 個目標欄位，最多 64 個並行探測，並非限制在 512 埠。</p>
</section>
<section class="ug-sec" id="ug-telemetry"><h2>16. Telemetry、Node Exporter 與 DCGM Exporter</h2>
<ol><li>先在系統詳情確認目前 Node／OS Slot，再開 Telemetry；整櫃視圖則在「機櫃管理」切到 Telemetry。</li>
<li>Host 監控使用 Node Exporter；GPU 監控使用 DCGM Exporter。兩者是獨立狀態，可分別安裝、啟用或重新檢查。</li>
<li>按「安裝／啟用」前核對目標節點與維護時段。作業可能在該節點安裝或啟動服務，並向中央 Prometheus 登記；既有健康 Exporter 會沿用。</li>
<li>自動處理不適用或失敗時展開「手動安裝說明」，依頁面提供的節點端與 PA Manager 端檢查步驟操作，再回來重新檢查。</li>
<li>「查看安裝紀錄」是唯讀 Console；關閉紀錄或離開頁面不會停止已送出的啟用作業，可從同一節點重新開啟並下載完整紀錄。</li>
<li>選時間範圍與圖表群組，先看採樣時間與狀態，再比較 CPU、記憶體、GPU、磁碟、網路、溫度與功率趨勢。</li></ol>
<p>CPU-only 節點的 GPU 狀態可為「不適用」，不需要安裝 DCGM Exporter。Host 已就緒、GPU 需要處理時，Host 圖表仍可使用；不要把兩者合併判成整個節點失敗。</p>
<p>「尚無資料」、「資料過舊」與「查詢未完成」都不是 0%，也不代表健康。整櫃彙總以該專案 L11 設備為範圍；欄位是否有值仍取決於採集器、設備能力、Prometheus 連線及實際樣本。</p>
</section>
<section class="ug-sec" id="ug-inspection"><h2>17. 系統巡檢、Inspection 與原始證據</h2>
<p>系統巡檢會用已保存且可歸屬目前系統／節點的硬體、事件與 Telemetry 資料做唯讀檢查；不會因巡檢本身改變設備電源狀態。</p>
<ol><li>先確認目前系統與巡檢涵蓋清單中的節點，查看巡檢是否啟用、最近完成時間、規則版本與資料完整度。</li>
<li>展開「資料來源與涵蓋範圍」，分辨資料有效、過舊、缺少、部分涵蓋、來源無法使用或 Cycle 預期恢復中。</li>
<li>按「立即巡檢」要求新一輪觀測；按「查看問題」後可依節點、狀態與關鍵字篩選目前問題、最近恢復及歷史紀錄。</li>
<li>「已知悉」、「標記已知問題」與「暫停通知 24 小時」只更新處理標記，不會改寫原始規則結果或修復硬體。</li>
<li>AI 輔助判讀可等待、完成、失敗或手動重新分析；它提供建議，不會改變 FAIL／WARN 規則判定。</li>
<li>有來源快照時按「查看原始證據」。預覽為唯讀，可搜尋、跳到下一筆、複製已載入內容；若顯示截斷，使用「下載完整證據」取得全文。</li></ol>
<p>資料未支援、採集失敗、身分不一致與硬體異常是不同狀態。原始證據的來源、採集時間及截斷說明應與問題紀錄一起核對；預覽載入失敗不代表原檔已不存在。</p>
</section>
<section class="ug-sec" id="ug-terminal"><h2>18. SSH Terminal 單機操作</h2>
<ol><li>核對右側目前目標及 OS Slot，再開 Terminal。</li>
<li>依介面選 OS、BMC 或雙視窗；非伺服器若缺認證，先補連線資料。</li>
<li>等待連線成功後再輸入命令；可縮放或展開視窗。</li>
<li>結束後關閉工作階段。</li></ol>
<p>Terminal 需要 SSH 服務、有效帳密與橋接服務正常。Ping 成功但 Terminal 失敗時，先檢查 SSH 埠、帳號、權限與服務，不要直接更換拓樸線路。若目前連線指向實體設備，輸入會直接送往該目標；務必先確認環境標示、Node 與 OS Slot。</p>
</section>
<section class="ug-sec" id="ug-broad"><h2>19. 廣播終端與多機指令</h2>
<ol><li>從單機／機櫃入口開廣播終端，勾選需要的設備或 OS 節點。</li>
<li>等各面板連線就緒；多 OS 會區分到對應節點。</li>
<li>選單機輸入或廣播模式，再次核對接收對象。</li>
<li>先用讀取型命令確認目標，再執行真正需要的工作。</li></ol>
<p>廣播會把輸入送往目前選定且已連線的目標；是否連到實體設備取決於目前部署與連線狀態。歷史命令不代表這次選取範圍與上次相同；重送前重新檢查。可以關閉個別面板，斷線目標需先恢復連線。</p>
</section>
<section class="ug-sec" id="ug-power"><h2>20. 電源控制與批次結果</h2>
<p>伺服器可依能力提供開機、關機、Reboot 與 AUX Cycle（影響範圍依設備設定核對）。Switch、CDU、Power Shelf 等只提供已支援或已配置的操作；空白面板沒有這些功能。</p>
<ol><li>確認設備、目前節點配對 BMC 及將執行的動作。</li>
<li>閱讀確認視窗；整櫃操作特別核對範圍。</li>
<li>追蹤等待、傳送中、已受理、失敗或取消結果。</li>
<li>失敗時先查原因並核對設備狀態；結果不明時不要重複送出電源命令。</li></ol>
<p>「已受理」只代表指令受理，不等於機器已完成開關機。取消只能阻止尚未送出的動作，不能撤回已送出的指令。Ping 狀態也不能取代 BMC 電源狀態確認。</p>
</section>
<section class="ug-sec" id="ug-kvm"><h2>21. KVM 遠端畫面與同步操作</h2>
<ol><li>單機確認 BMC 配對後開 KVM；若新視窗被擋，允許此站台的彈出視窗。</li>
<li>整櫃 KVM 會列出有 BMC 的候選設備，依協定與連線結果建立面板。</li>
<li>需要同步時選主控畫面，分別啟用鍵盤與滑鼠同步。</li>
<li>可使用 F2、F11、F12、Esc、Enter、Ctrl＋Alt＋Del 等工具按鍵；操作前確認主控與接收面板。</li>
<li>可展開單一畫面或回格狀排列；結束時關閉連線。</li></ol>
<p>候選設備數不等於已連線數。同步僅適用實際相容並已連線的 RFB 面板；不相容設備會顯示原因。目前 SP-X／MegaRAC IVTP 在此介面不支援。</p>
<p>一般連線錯誤會有限次重試；認證失敗要先修正認證，手動重新連線即可。黑畫面或超時請確認 BMC、協定與 KVM 橋接服務，不代表 OS 一定離線。</p>
</section>
<section class="ug-sec" id="ug-tasks"><h2>22. Test Library：PA Agent 與 Batch Instructions</h2>
<ol><li>從系統詳情的「驗證」頁開啟 Test Library，先核對上方目前指派目標的專案、系統、Node 與 OS IP。</li>
<li>選分類／工作表，搜尋測項並翻頁；閱讀套件、前置條件、步驟、指令、預期證據、恢復程序與判定標準。</li>
<li><b>只選一筆：</b>主要動作是「交給 PA Agent」。開窗後 PA Agent 先提出執行計畫並停在等待確認，不會因開窗就執行。</li>
<li>審閱計畫後，由工程師在對話框<b>手動輸入 <code>OK</code> 或 <code>GO</code> 並按 Enter</b>才開始；Shift＋Enter 換行。若輸入補充或問題，Agent 會更新計畫並繼續等待最新版本的確認。</li>
<li><b>選兩筆以上：</b>主要動作改為「產生批次指令 (N)」（Batch Instructions）。它只整理並複製全部已選測項，不會開 PA Agent，也不會執行命令。</li>
<li>若單選時 PA Agent 入口不可用，介面只產生可複製指令。請在選定的 Terminal 或外部工具操作並保存輸出。</li></ol>
<p><b>PA Agent 顯示 DONE，只表示 Agent 已停止工作並產出記錄，狀態仍是「等待工程師判定」，不是 PASS。</b>工程師必須依命令紀錄、證據、預期結果與例外情況判定 PASS／FAIL／BLOCKED。指派、複製或送出 OK／GO 也都不等於測試通過。</p>
<p>切換分類或工作表會更新選取範圍，送出前重新核對。測試案例無法載入時請重試；不要用空白清單推斷該系統沒有測項。</p>
</section>
<section class="ug-sec" id="ug-cycle"><h2>23. Cycle：PRE、停止與 Recovery</h2>
<ol><li>從 Cycle 工作區或機框／節點入口建立任務，選專案、Reboot／DC Power Cycle／AUX Cycle、Inband／Outband、輪次或時數，再勾選 Chassis 下的 Node。</li>
<li>先讀環境標示：「測試模式」不操作實體設備；只有經部署與能力確認且畫面標示 LIVE 的任務才可視為硬體連線流程。</li>
<li>建立任務後系統先執行並保存 PRE。LIVE PRE 可能安裝依賴或上傳驗證腳本；PRE 完成不代表硬體已通過。</li>
<li>審閱 PRE 版本、每個目標的 findings、排除原因、可執行清單及完整影響範圍，再按「確認這份 PRE 與完整影響範圍，開始執行」。確認綁定同一份 PRE，資料變更時應重新審閱。</li>
<li>執行中分開看任務狀態、累積健康、有效輪數、Boot／POST 與覆蓋；<code>COMPLETE</code> 是執行終點，不自動等於硬體 PASS。</li>
<li>「停止：不再派送新動作」只阻止後續派送。已派送的動作仍會收尾或進入 Recovery；不要把按下停止當作所有設備已立即停止。</li>
<li>瀏覽器斷線或關閉頁面不會證明 worker 已停止。回到同一任務查看 heartbeat、停止原因與節點進度；Live Console 是唯讀，關閉 Console 也不會停止任務。</li>
<li>若顯示「結果未知／待核對／相關資源仍占用」，先檢視待核對動作、實際影響範圍與殘存程序，再填寫核對依據並依權限請求釋放；Recovery 不會重新送出電源命令。</li></ol>
<p>停止、中斷、INCOMPLETE 或待核對的任務仍保留既有證據。只有終態任務可刪除；刪除會一併移除該任務的 Evidence 與 log，而且無法復原。</p>
</section>
<section class="ug-sec" id="ug-reports"><h2>24. Test Results、Evidence 與下載</h2>
<ol><li>進入 Cycle 任務後，Test Results 會自動載入第一批報告與 Evidence。先看 Official HTML Report，再依 Node、Loop／Phase、Evidence Type、WARN／FAIL 與檔名篩選；大量檔案可按「載入更多」。</li>
<li>Cycle Review 報告、Cycle 摘要、最終執行結果、已知／新增／惡化問題與各輪 JSON 都是保存的執行資料；仍須連同健康與覆蓋判讀，不能只因有報告就標記 PASS。</li>
<li>Download Full ZIP 只在安全終態提供，下載整個 Run 的允許交付資料與 Manifest；RUNNING／STOP_REQUESTED 不可建立。ERROR／RECONCILIATION_REQUIRED 必須先確認 Runner 已停止及資料一致性。</li>
<li>Live Console 可依節點、Errors 與文字篩選，並切換 Summary／Full、暫停檢視或查找 History；畫面只保存有限筆瀏覽內容，需要完整紀錄時使用 Console 的下載功能。</li>
<li>Telemetry 啟用 Console 使用「下載完整紀錄」；Inspection 原始證據預覽若截斷，使用「下載完整證據」。下載前核對系統、Node、來源與時間。</li>
<li>網路拓樸的 JSON 匯出用於保留目前草稿／配置；目前沒有對應匯入介面。它不是 Cycle 測試報告，也不是實體接線驗證證明。</li></ol>
<p>報告與下載可能包含內部名稱、IP、命令輸出或硬體識別。分享前依公司規範處理敏感資訊，不要附上帳號密碼；下載失敗時保留畫面上的任務 ID、檔名與錯誤訊息再重試。</p>
</section>
<section class="ug-sec" id="ug-ai"><h2>25. AI 助理與摘要功能</h2>
<p>AI 助理可協助查詢專案、設備連線狀態與系統摘要。先確認目前專案或設備，再提出查詢。</p>
<ul><li>以原始資料、採樣時間及工具輸出核對分析結果。</li><li>可查詢範圍依帳號權限及可用資料決定；分析結果不會取代硬體驗證。</li><li>無法完成分析時，可先查看原始紀錄，並請管理者檢查服務狀態。</li></ul>
<p>資料處理位置依部署設定決定；提交敏感資訊前，請確認公司使用規範與服務設定。</p>
</section>
<section class="ug-sec" id="ug-sec"><h2>26. 儲存範圍、多人協作與容量</h2>
<p>下表列出主要資料，不是所有部署資料的完整清單；實際保留期限與下載權限依部署政策。</p>
<table class="ug-table"><tr><th>資料</th><th>保存與更新方式</th></tr><tr><td>庫存、Node、OS Slot、配置</td><td>由對應表單儲存到後端；管理 IP 紀錄不會修改設備網路設定。</td></tr><tr><td>拓樸草稿</td><td>先套用，再儲存整份拓樸；匯出 JSON 可保留規劃。</td></tr><tr><td>拓樸設備快照</td><td>庫存改名、搬移、刪除或節點變更後，需核對快照與實體對應。</td></tr><tr><td>Ping 結果</td><td>本次快照，依操作重跑；不是持續監控、硬體健康或驗證通過的證據。</td></tr><tr><td>PA Agent 對話、附件與活動</td><td>依 Agent run 保存；DONE 不改寫成 PASS。刪除或保留方式依部署權限與政策。</td></tr><tr><td>Telemetry 啟用紀錄</td><td>依節點與作業保存，重開頁面可續看可用紀錄；完整紀錄可由唯讀 Console 下載。</td></tr><tr><td>Cycle PRE、執行紀錄與證據</td><td>依任務持久保存；停止或中斷不會自動刪除。刪除終態任務時會一併移除且無法復原。</td></tr><tr><td>Inspection 問題與證據</td><td>保留狀態、恢復歷史、處理標記與來源快照；處理標記不會改寫原始觀測。</td></tr><tr><td>手冊位置、部分顯示偏好</td><td>存在目前瀏覽器；換裝置或清除網站資料後可能重設。</td></tr></table>
<p>每專案最多 32 個拓樸 Rack；每 Rack 最多 256 個設備與 2048 條線；每設備最多 64 個節點與 256 個埠。拓樸標籤最多 160 字元，IP 使用有效 IPv4／IPv6。超出單一 Rack 規劃容量時先分組，並留意跨組接線需求。</p>
<p>拓樸用來保存位址與接線，不填帳號密碼。分享匯出檔或截圖前留意內部名稱與 IP。多人修改遇版本衝突時保留草稿再核對，不要直接覆蓋他人規劃。</p>
</section>
<section class="ug-sec" id="ug-faq"><h2>27. 常見問題與排查順序</h2>
<h3>儲存後圖上沒有東西？</h3><p>先確認專案及拓樸 Rack，並按過「儲存拓樸」，不是只有套用草稿。3D 另需設備對應到庫存、已上架且兩端有效；自訂設備不會憑空變成實體模型。</p>
<h3>四個節點只畫兩條線正常嗎？</h3><p>正常，若實際只有兩個共享管理 RJ45。節點數影響位址與檢查結果，不等於實體線數；請核對埠的節點映射。</p>
<h3>Ping 成功，但 SSH、KVM 或 Telemetry 失敗？</h3><p>分別檢查 SSH／BMC 認證、協定、橋接服務及 Exporter。ICMP 可達不代表這些服務正常。</p>
<h3>Ping 沒回應但設備有電？</h3><p>檢查 IP、網段路由、防火牆及 ICMP 是否允許，再查設備。LED 反映可達性，不能當電源量測。</p>
<h3>沒有紅綠閃燈，或一直灰色？</h3><p>先執行 Ping Rack，確認設備已上架、有可用管理 IP 且不是空白面板。若顏色正確但不閃，檢查是否啟用減少動態效果、暫停動畫或頁面不在前景。</p>
<h3>升 L11 或修正高度無法儲存？</h3><p>檢查目標專案、1～48U 範圍、碰撞與資料是否已被其他人修改。外置 CDU 用專用安裝設定，不能當一般 0U Server。</p>
<h3>PA Agent 顯示 DONE，為什麼還不是 PASS？</h3><p>DONE 只表示 Agent 已停止工作並產出記錄。請由工程師核對 Test Case 的判定標準、命令紀錄與證據，再決定 PASS、FAIL 或 BLOCKED。</p>
<h3>Cycle 按了停止，為什麼還有動作在收尾？</h3><p>停止只阻止新動作派送；已派送的操作仍要完成收尾或 Recovery。回到任務查看 heartbeat、節點階段與待核對狀態，不要重複送出電源命令。</p>
<h3>頁面無法載入或操作失敗？</h3><p>先保留錯誤訊息與操作時間，再重新整理頁面。若持續發生，請提供目前專案、設備與操作步驟給管理者。</p>
<h3>畫面與使用手冊不一致？</h3><p>請重新整理頁面，並向管理者確認目前使用的系統版本。</p>
</section>
<section class="ug-sec" id="ug-key"><h2>28. 快捷鍵與閱讀提示</h2>
<table class="ug-table"><tr><th>操作</th><th>用途</th></tr><tr><td>?</td><td>一般頁面焦點開啟使用手冊；在輸入欄、可編輯內容、Terminal、廣播終端或 KVM 操作中不會攔截按鍵。</td></tr><tr><td>手冊搜尋</td><td>依整段內容篩選，例如 OS Slot、PA Agent、PRE、Exporter、Evidence、KVM。清空恢復全部。</td></tr><tr><td>手冊目錄連結</td><td>跳到指定章節，不切換目前系統頁面。</td></tr><tr><td>手冊標題列與右下角</td><td>拖動位置與調整大小；最小化後可點標題列，或再次啟用同一個最小化控制來還原。</td></tr><tr><td>3D 方向鍵／Shift＋方向鍵</td><td>畫布聚焦時旋轉；Home 重設，＋／－縮放。</td></tr></table>
<p>遇問題時提供：專案、設備、目前 OS 節點、操作名稱、錯誤訊息與時間；不要附上帳密。先分辨配置問題、位址可達性、登入認證及服務整合，可更快找到原因。</p>
</section>
